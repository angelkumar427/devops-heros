# Source: task-tracker/templates/pdb.yaml
# Voluntary disruptions (node drain, cluster upgrade) may evict at most one pod at a time,
# so the Service always keeps an endpoint. Deleting every pod by hand bypasses this and
# gives a few seconds of 503s from the ingress - see the README's persistence test.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: task-tracker
  labels:
    app.kubernetes.io/name: task-tracker
    app.kubernetes.io/instance: task-tracker
    app.kubernetes.io/version: "1.2.0"
    app.kubernetes.io/managed-by: Helm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-tracker
      app.kubernetes.io/instance: task-tracker

---
