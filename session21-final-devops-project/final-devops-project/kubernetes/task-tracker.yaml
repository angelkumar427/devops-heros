# Source: task-tracker/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker
  labels:
    app.kubernetes.io/name: task-tracker
    app.kubernetes.io/instance: task-tracker
    app.kubernetes.io/version: "1.2.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: task-tracker
      app.kubernetes.io/instance: task-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-tracker
        app.kubernetes.io/instance: task-tracker
      annotations:
        # Roll the pods whenever config or secret changes - env vars are fixed at
        # container start, so without this a config change would never take effect.
        checksum/config: fe73a31261c471cf06f8f38cc69d90d0d5b8f57d9a9af6988022620a537246d4
        checksum/secret: 3d5539cb20c4bf7f0fc801c3b762728b9d61a7d3e9270b04f8515842b06a6db7
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: task-tracker
          image: "task-tracker:1.2.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: task-tracker-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: API_TOKEN
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            limits:
              cpu: 300m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: task-tracker-data
        - name: tmp
          emptyDir: {}

