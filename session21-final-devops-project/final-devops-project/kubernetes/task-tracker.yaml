# Source: task-tracker/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker
  labels:
    app.kubernetes.io/name: task-tracker
    app.kubernetes.io/instance: task-tracker
    app.kubernetes.io/version: "1.2.1"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: task-tracker
      app.kubernetes.io/instance: task-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-tracker
        app.kubernetes.io/instance: task-tracker
      annotations:
        # Roll the pods whenever config or secret changes - env vars are fixed at
        # container start, so without this a config change would never take effect.
        checksum/config: 1f783e022a029e7acebaca02f1bc893eede3e24f3b70c8aad5c6f80a722be5a2
        checksum/secret: cde6364d3740299864affdf96ab1e9a7abdeb00eb2cf7ede4a3cfcf5d5519a2e
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: task-tracker
          image: "task-tracker:1.2.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: task-tracker-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: API_TOKEN
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            limits:
              cpu: 300m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: task-tracker-data
        - name: tmp
          emptyDir: {}

