apiVersion: v1
kind: Service
metadata:
  name: {{ include "tt.name" . }}
  labels: {{- include "tt.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "tt.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
