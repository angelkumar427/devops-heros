{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tt.name" . }}
  labels: {{- include "tt.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "tt.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
