# Lab 1 - a Deployment that can never start. Find out why from the cluster alone.
#   kubectl apply -f troubleshooting/broken-image.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: stockpilot-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-preview
  namespace: stockpilot-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: storefront-preview }
  template:
    metadata:
      labels: { app: storefront-preview }
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.31-alpinee
          ports: [{ containerPort: 8080 }]
