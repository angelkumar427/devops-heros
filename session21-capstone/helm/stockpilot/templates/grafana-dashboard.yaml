{{- if .Values.monitoring.enabled }}
# Grafana's sidecar (kube-prometheus-stack) loads every ConfigMap labelled grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sp.name" . }}-dashboard
  labels:
    {{- include "sp.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  stockpilot.json: |-
{{ .Files.Get "dashboards/stockpilot.json" | indent 4 }}
{{- end }}
