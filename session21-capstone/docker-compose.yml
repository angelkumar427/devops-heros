# Full local stack: PostgreSQL + FastAPI backend + React/nginx frontend.
#   docker compose up --build        -> http://localhost:3000  (API docs: http://localhost:8000/docs)
#   docker compose down [-v]         -> stop (and delete the database volume)
name: stockpilot

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpilot-dev}   # local-only default; override via .env
    volumes:
      - pgdata:/var/lib/postgresql        # Postgres 18 keeps PGDATA under here (18/docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    image: stockpilot-backend:local
    environment:
      APP_ENV: compose
      POSTGRES_HOST: postgres
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpilot-dev}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  frontend:
    build: ./frontend
    image: stockpilot-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  pgdata:
