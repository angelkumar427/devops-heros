# Capstone: ConfigMap + Secret + Deployments + Services + Ingress in one stack.
# The backend renders a page from values injected out of the ConfigMap and Secret,
# so the page itself is the proof that all three mechanisms are wired together.
apiVersion: v1
kind: ConfigMap
metadata: { name: yatri-app-config }
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DEFAULT_CURRENCY: "INR"
  MAX_BOOKING_DAYS: "30"
---
apiVersion: v1
kind: Secret
metadata: { name: yatri-db-secret }
type: Opaque
data:
  POSTGRES_USER: eWF0cmlfYWRtaW4=          # yatri_admin
  POSTGRES_PASSWORD: c2VjcmV0cGFzc3dvcmQ=  # secretpassword
  POSTGRES_DB: eWF0cmlfcHJvZHVjdGlvbl9kYg== # yatri_production_db
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: yatri-backend, labels: { app: yatri-backend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: yatri-backend } }
  template:
    metadata: { labels: { app: yatri-backend } }
    spec:
      containers:
        - name: api
          image: nginx:1.25-alpine
          ports: [{ containerPort: 80 }]
          envFrom:
            - configMapRef: { name: yatri-app-config }
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: yatri-db-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: yatri-db-secret, key: POSTGRES_PASSWORD } }
          volumeMounts:
            - { name: secret-vol, mountPath: /etc/dbsecret, readOnly: true }
          # Render a status page from the injected values at container start.
          command: ["/bin/sh","-c"]
          args:
            - |
              cat > /usr/share/nginx/html/index.html <<EOF
              <h1>BACKEND API</h1>
              <p>Config and secrets injected at runtime:</p>
              <ul>
                <li>ENVIRONMENT (ConfigMap) = $ENVIRONMENT</li>
                <li>LOG_LEVEL (ConfigMap) = $LOG_LEVEL</li>
                <li>DEFAULT_CURRENCY (ConfigMap) = $DEFAULT_CURRENCY</li>
                <li>DB_USER (Secret) = $DB_USER</li>
                <li>DB_PASSWORD (Secret) = [REDACTED, length ${#DB_PASSWORD}]</li>
                <li>secret file mount = \$(cat /etc/dbsecret/POSTGRES_DB)</li>
              </ul>
              EOF
              sed -i "s|\\\$(cat /etc/dbsecret/POSTGRES_DB)|$(cat /etc/dbsecret/POSTGRES_DB)|" /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
      volumes:
        - name: secret-vol
          secret: { secretName: yatri-db-secret, defaultMode: 0400 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: yatri-frontend, labels: { app: yatri-frontend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: yatri-frontend } }
  template:
    metadata: { labels: { app: yatri-frontend } }
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports: [{ containerPort: 80 }]
          envFrom:
            - configMapRef: { name: yatri-app-config }
          command: ["/bin/sh","-c"]
          args:
            - |
              cat > /usr/share/nginx/html/index.html <<EOF
              <h1>YATRI FRONTEND</h1>
              <p>Environment: $ENVIRONMENT &middot; Currency: $DEFAULT_CURRENCY</p>
              <p>API is routed at <a href="/api">/api</a> through the same Ingress.</p>
              EOF
              exec nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata: { name: yatri-backend-service }
spec:
  selector: { app: yatri-backend }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: yatri-frontend-service }
spec:
  selector: { app: yatri-frontend }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yatri-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: yatri.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: yatri-backend-service, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: yatri-frontend-service, port: { number: 80 } } }
