apiVersion: v1
kind: Pod
metadata:
  name: secret-consumer
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: alpine:3.19
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_PASSWORD
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/dbsecret
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: yatri-db-secret
        defaultMode: 0400
